<header class="topbar">
  <div class="wrap topbar__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <nav class="nav" aria-label="Site">
      {% for item in site.nav %}
      {% assign is_current = false %}
      {% if page.url == item.url %}{% assign is_current = true %}{% endif %}
      <a href="{{ item.url | relative_url }}"{% if is_current %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <a href="{{ site.author.cv }}" target="_blank" rel="noopener">CV</a>
    </nav>
  </div>
</header>
