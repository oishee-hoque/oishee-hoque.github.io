<footer class="footer">
  <div class="wrap footer__inner">
    <p class="footer__contact">
      <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
      <span class="footer__sep" aria-hidden="true"></span>
      <a href="{{ site.author.scholar }}" target="_blank" rel="noopener">Google Scholar</a>
      <span class="footer__sep" aria-hidden="true"></span>
      <a href="{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>
      <span class="footer__sep" aria-hidden="true"></span>
      <a href="{{ site.author.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
      <span class="footer__sep" aria-hidden="true"></span>
      <a href="{{ site.author.researchgate }}" target="_blank" rel="noopener">ResearchGate</a>
    </p>
    <p class="footer__meta">&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}. Last updated {{ site.time | date: '%B %Y' }}.</p>
  </div>
</footer>
