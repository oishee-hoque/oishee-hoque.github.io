    summary: "AI-assisted characterization of post-Hurricane Helene forest damage from UAS imagery."
    bullets:
      - "Adapted foundation models (SAM, Mask2Former) and fused LiDAR- and photogrammetry-derived height products for instance-level detection of fallen logs."
      - "Built the CWDBench benchmark (WACV 2027 Datasets Track): 10k+ verified instances with oriented boxes and masks, cross-site and cross-sensor evaluation, and a centerline metric for elongated objects."
      - "Co-developed ARFA, an agentic riverine-flood-response assistant selected as a finalist in the ACM SIGSPATIAL OASIS 2026 challenge."

  - role: "Graduate Research Assistant"
    home: 4
    org: "Biocomplexity Institute, University of Virginia"
    org_url: "https://biocomplexity.virginia.edu/"
    location: "Charlottesville, VA"
    start: "Aug 2021"
    end: "present"
    summary: "Knowledge-guided computer vision and large-scale datasets for agricultural and environmental mapping, advised by Madhav Marathe."
    bullets:
      - "Released IrrMap (KDD 2025) and IRRISIGHT (NeurIPS 2025), two of the largest public multimodal datasets for irrigation and agricultural water management, with end-to-end ML-ready pipelines."
      - "Designed KIIM (IJCAI 2025), a knowledge-guided irrigation-mapping model that injects crop-type and land-use priors through cross-attention, and IGraSS (IJCAI 2025), which couples segmentation with graph constraints for canal-network extraction."
      - "Built the PRISM-CAFO (WACV 2026) and CAFOSat (EarthVision @ CVPR 2026) pipelines for prior-conditioned livestock-facility detection and strongly annotated dataset creation from NAIP imagery."
    tech: "Python, PyTorch, Hugging Face, OpenCV, rasterio/GDAL, QGIS, scikit-learn, NumPy, pandas, Matplotlib"

