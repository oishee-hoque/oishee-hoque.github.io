- key: cafosat
  title: "CAFOSat: A Strongly Annotated Dataset for Infrastructure-Aware CAFO Mapping Using High-Resolution Imagery"
  venue: "EarthVision Workshop, IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR)"
  venue_short: "EarthVision @ CVPR 2026"
  year: 2026
  note: "A semi-automated annotation pipeline that refines imprecise public CAFO records into facility boxes and infrastructure-level labels (barns, manure lagoons, feed storage), with curated hard negatives and validated synthetic imagery to benchmark robustness under distribution shift."
  authors:
    - {name: "Oishee Bintey Hoque", me: true, equal: true}
    - {name: "Nibir Chandra Mandal", equal: true}
    - {name: "Mandy L. Wilson"}
