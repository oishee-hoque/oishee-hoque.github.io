- key: prism-cafo
  title: "PRISM-CAFO: Prior-Conditioned Remote-Sensing Infrastructure Segmentation and Mapping for CAFOs"
  venue: "IEEE/CVF Winter Conference on Applications of Computer Vision (WACV)"
  venue_short: "WACV 2026"
  year: 2026
  note: "Infrastructure-first, explainable CAFO mapping: YOLO detects barns, lagoons and feedlots, SAM turns them into geometry-filtered masks, and structural descriptors fused with deep visual features classify the facility type and tie each decision to visible infrastructure."
