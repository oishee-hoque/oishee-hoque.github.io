- key: kiim
  title: "Knowledge-Informed Deep Learning for Irrigation Type Mapping from Remote Sensing"
  venue: "International Joint Conference on Artificial Intelligence (IJCAI)"
  venue_short: "IJCAI 2025"
  year: 2025
  note: "A Swin-Transformer that injects agronomic knowledge: a projection matrix encoding crop-to-irrigation probabilities, a spatial attention map separating farmland from non-agricultural land, bi-directional cross-attention between image and crop modalities, a weighted ensemble, and two-phase transfer learning across states."
