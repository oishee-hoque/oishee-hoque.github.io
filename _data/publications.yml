# Publications, newest first. Each entry:
#   key        short id (used for the thumbnail file images/pubs/<key>.webp and anchors)
#   title, venue, venue_short, year
#   authors    list; mark yourself with me: true; mark co-first authors with equal: true;
#              optional url (e.g. an OpenReview profile) makes the name a link
#   note       optional one-line context (award, oral, finalist...)
#   tags       any of: first-author, dataset, journal, selected; plus research areas knowledge, datasets, foundation (home-page filters)
#   links      list of {label, url}
#   thumb      optional override; defaults to /images/pubs/<key>.webp (720x480, a figure from the paper).
#              Set thumb: none for a tile instead: on its own it shows the venue's first word in large
#              letters (e.g. ICCIT), or `tile` if given. Add tile_icon (a file in _includes/icons/, without
#              .svg) for an icon tile, and tile_style: soon for the grey "not yet public" look.

