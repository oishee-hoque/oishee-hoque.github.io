- key: irrisight
  title: "IRRISIGHT: A Large-Scale Multimodal Dataset and Scalable Pipeline to Address Irrigation and Water Management in Agriculture"
  venue: "Advances in Neural Information Processing Systems (NeurIPS)"
  venue_short: "NeurIPS 2025"
  year: 2025
  note: "A scalable pipeline that aligns raster, vector and point data (soil, hydrology, crops, land use, climate) on a common 10 m grid and turns tabular attributes into domain-informed text prompts: 1.4M pixel-aligned image–text patches across 20 states for benchmarking vision and vision–language models."
