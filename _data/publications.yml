- key: igrass
  title: "IGraSS: Learning to Identify Infrastructure Networks from Satellite Imagery by Iterative Graph-Constrained Semantic Segmentation"
  venue: "International Joint Conference on Artificial Intelligence (IJCAI)"
  venue_short: "IJCAI 2025"
  year: 2025
  note: "An iterative framework that couples semantic segmentation (RGB, NDWI and elevation inputs) with graph-based reachability constraints that repair incomplete canal ground truth, then retrains on the refined labels; a different graph constraint carries it over to road networks."
