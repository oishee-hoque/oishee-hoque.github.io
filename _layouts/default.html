<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body class="page-{{ page.id | default: page.permalink | replace: '/', '' | default: 'home' }}">
  <a class="skip" href="#main">Skip to content</a>
  {% include nav.html %}
  <main id="main" class="wrap">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
