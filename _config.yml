# Open Graph / Twitter preview image (1200x630)
og_image: "/images/og.png"

analytics:
  measurement_id: "G-37E1610WB8"

nav:
  - title: "About"
    url: "/"
  - title: "Publications"
    url: "/publications/"
  - title: "Awards & Activities"
    url: "/activities/"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: lsquo,rsquo,ldquo,rdquo
permalink: pretty
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - node_modules
  - .jekyll-cache
  - .bundle

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /images/og.png
