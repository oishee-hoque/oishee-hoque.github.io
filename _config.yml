url: "https://oishee-hoque.github.io"
baseurl: ""
repository: "oishee-hoque/oishee-hoque.github.io"
lang: en
timezone: America/New_York

author:
  name: "Oishee Bintey Hoque"
  short_name: "Oishee Hoque"
  email: "oishee@virginia.edu"
  role: "PhD Candidate, Computer Science"
  institution: "University of Virginia"
  institution_url: "https://engineering.virginia.edu/departments/computer-science"
  group: "Biocomplexity Institute"
  group_url: "https://biocomplexity.virginia.edu/"
